<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Invitación de cumpleaños</title>
<meta name="theme-color" content="#e2020c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --rojo:#e2020c;          /* mismo rojo que la imagen de Duff */
  --amarillo:#ffd90f;
  --cielo:#2fb4e0;
  --crema:#fff6d6;
  --tinta:#1b1b1b;
  --f-titulo:'Bangers','Impact',sans-serif;
  --f-texto:'Nunito','Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--rojo);color:var(--tinta);font-family:var(--f-texto);font-weight:700;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.cerrada{overflow:hidden;height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:0 18px}

/* ───────── PORTADA ───────── */
#portada{position:fixed;inset:0;z-index:100;background:var(--cielo) url('img/portada.jpg') 38% top / cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 22px calc(46px + env(safe-area-inset-bottom));text-align:center;transition:opacity .8s ease,visibility .8s}
#portada::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 28%,rgba(0,0,0,0) 48%,rgba(120,0,0,.88) 100%);pointer-events:none}
#portada>*{position:relative;z-index:1}
#portada.oculta{opacity:0;visibility:hidden}
.p-sup{font-family:var(--f-titulo);font-size:22px;letter-spacing:3px;color:#fff;text-shadow:2px 2px 0 var(--tinta),-1px -1px 0 var(--tinta),1px -1px 0 var(--tinta),-1px 1px 0 var(--tinta);position:absolute !important;top:calc(26px + env(safe-area-inset-top));left:0;right:0}
.p-t{font-family:var(--f-titulo);font-size:56px;line-height:.95;letter-spacing:1px;color:var(--amarillo);-webkit-text-stroke:2px var(--tinta);paint-order:stroke fill;text-shadow:4px 4px 0 var(--tinta)}
.p-n{font-family:var(--f-titulo);font-size:84px;line-height:1;letter-spacing:2px;color:#fff;-webkit-text-stroke:2.5px var(--tinta);paint-order:stroke fill;text-shadow:5px 5px 0 var(--tinta);margin:2px 0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--f-titulo);font-size:24px;letter-spacing:2px;color:var(--tinta);background:var(--amarillo);border:3px solid var(--tinta);border-radius:999px;padding:12px 32px;box-shadow:0 5px 0 var(--tinta);cursor:pointer;text-decoration:none;transition:transform .1s,box-shadow .1s;-webkit-tap-highlight-color:transparent}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--tinta)}

/* ───────── FONDO COMPLETO (se desplaza con el scroll) ───────── */
#fondo{position:fixed;top:0;bottom:0;left:50%;width:min(100vw,480px);transform:translateX(-50%);background:var(--rojo) url('img/fondo.jpg') center 0 / 100% auto no-repeat;z-index:0;visibility:hidden}
body.abierta #fondo{visibility:visible}
main.wrap{position:relative;z-index:1;text-align:center}

/* ───────── HERO ───────── */
.hero{min-height:60vh;min-height:60svh;display:flex;flex-direction:column;justify-content:flex-end;padding:90px 0 6px;text-align:center}
.hero-sup{font-family:var(--f-titulo);font-size:24px;letter-spacing:3px;color:#fff;-webkit-text-stroke:1.5px var(--tinta);paint-order:stroke fill;text-shadow:2px 2px 0 var(--tinta)}
.hero-name{font-family:var(--f-titulo);font-size:76px;line-height:1;letter-spacing:2px;color:var(--amarillo);-webkit-text-stroke:2.5px var(--tinta);paint-order:stroke fill;text-shadow:5px 5px 0 var(--tinta);margin:0 0 14px}
.marco{position:relative;margin:0 auto;max-width:360px;background:#fff;border:4px solid var(--tinta);border-radius:22px;padding:10px 10px 12px;box-shadow:7px 7px 0 var(--tinta);transform:rotate(-2deg)}
.marco img{display:block;width:100%;height:auto;border-radius:12px;border:3px solid var(--tinta)}
.marco::before{content:"";position:absolute;top:-16px;left:50%;width:84px;height:26px;transform:translateX(-50%) rotate(3deg);background:rgba(255,217,15,.9);border:2px solid var(--tinta)}
.hero-lema{font-family:var(--f-titulo);font-size:28px;letter-spacing:1.5px;color:#fff;-webkit-text-stroke:1.5px var(--tinta);paint-order:stroke fill;text-shadow:2px 2px 0 var(--tinta);margin:6px 0 14px}
.cuenta{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cuenta div{background:rgba(255,217,15,.62);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border:3px solid var(--tinta);border-radius:14px;padding:10px 0 8px;box-shadow:0 4px 0 var(--tinta)}
.cuenta b{color:#000;display:block;font-family:var(--f-titulo);font-size:38px;line-height:1;font-weight:400}
.cuenta span{font-size:11px;letter-spacing:1.5px;font-weight:800}

/* ───────── INFO ───────── */
.sec-titulo{font-family:var(--f-titulo);font-size:40px;letter-spacing:2px;color:#fff;text-align:center;-webkit-text-stroke:2px var(--tinta);paint-order:stroke fill;text-shadow:3px 3px 0 var(--tinta);margin:70px 0 18px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:rgba(255,246,214,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border:3px solid var(--tinta);border-radius:18px;box-shadow:5px 5px 0 var(--tinta);padding:18px 12px 16px;text-align:center}
.card.ancha{grid-column:1/-1}
.card .ico{font-size:30px;line-height:1}
.card .rot{font-family:var(--f-titulo);font-size:20px;letter-spacing:2px;color:#c40009;margin:6px 0 2px;font-weight:400}
.card .val{font-size:20px;line-height:1.2;font-weight:800;color:#000}
.card .sub{font-size:15px;font-weight:800;color:#222;margin-top:2px}
.card .btn{margin-top:14px;font-size:20px;padding:9px 24px}

/* ───────── CONFIRMAR ───────── */
.form{text-align:left;background:rgba(255,246,214,.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border:3px solid var(--tinta);border-radius:20px;box-shadow:6px 6px 0 var(--tinta);padding:22px 18px}
.form label.l{display:block;font-family:var(--f-titulo);font-size:20px;letter-spacing:1.5px;color:#c40009;margin:0 0 6px;font-weight:400}
.form .campo{margin-bottom:18px}
.form input[type=text],.form textarea{width:100%;font:inherit;font-weight:700;font-size:17px;color:var(--tinta);background:rgba(255,255,255,.6);border:3px solid var(--tinta);border-radius:12px;padding:12px 14px;outline:none}
.form input:focus,.form textarea:focus{box-shadow:0 0 0 3px var(--amarillo)}
.form textarea{min-height:84px;resize:vertical}
.tog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tog button{font-family:var(--f-titulo);font-size:20px;letter-spacing:1.5px;background:rgba(255,255,255,.6);color:var(--tinta);border:3px solid var(--tinta);border-radius:12px;padding:11px 6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.tog button.on{background:rgba(255,217,15,.8);box-shadow:0 3px 0 var(--tinta)}
.form .btn{width:100%;font-size:22px;background:#2fb344;color:#fff;text-shadow:2px 2px 0 var(--tinta)}
.error{display:none;color:var(--rojo);font-size:14px;margin:-8px 0 12px}

/* ───────── CIERRE ───────── */
.cierre{min-height:95vh;min-height:95svh;display:flex;align-items:flex-end;justify-content:center;text-align:center;padding-bottom:calc(min(100vw,480px)*1.06 + 14px)}
.firma{font-family:var(--f-titulo);font-size:34px;letter-spacing:2px;color:#fff;-webkit-text-stroke:2px var(--tinta);paint-order:stroke fill;text-shadow:3px 3px 0 var(--tinta)}

/* ───────── MÚSICA ───────── */
#musica{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:90;width:46px;height:46px;border-radius:50%;background:var(--amarillo);border:3px solid var(--tinta);box-shadow:0 4px 0 var(--tinta);font-size:20px;cursor:pointer;display:none;align-items:center;justify-content:center}
#musica.ver{display:flex}
#musica.suena{animation:pulso 1.4s ease-in-out infinite}
@keyframes pulso{50%{transform:scale(1.08)}}

/* aparición suave */
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}
.rv.vis{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}#musica.suena{animation:none}}
@media (max-width:360px){.p-t{font-size:46px}.p-n{font-size:70px}.hero-name{font-size:76px}.cuenta b{font-size:30px}}
</style>
</head>
<body class="cerrada">

<!-- PORTADA -->
<div id="portada">
  <div class="p-sup">¡ESTÁS INVITADO!</div>
  <div class="p-t">MI CUMPLE</div>
  <div class="p-n" id="p-nombre"></div>
  <button class="btn" id="btn-abrir" type="button">ABRIR INVITACIÓN</button>
</div>

<div id="fondo" aria-hidden="true"></div>
<audio id="audio" loop preload="auto" src="assets/musica.mp3"></audio>
<button id="musica" type="button" aria-label="Música" title="Música">🎵</button>

<main class="wrap">
  <!-- HERO -->
  <section class="hero rv">
    <p class="hero-sup">¡VENÍ A FESTEJAR MI CUMPLE!</p>
    <h1 class="hero-name" id="h-nombre"></h1>
  </section>

  <!-- CUENTA REGRESIVA -->
  <section class="rv" style="margin-top:44px">    <p class="hero-lema">FALTAN</p>
    <div class="cuenta" aria-live="off">
      <div><b id="c-d">0</b><span>DÍAS</span></div>
      <div><b id="c-h">0</b><span>HORAS</span></div>
      <div><b id="c-m">0</b><span>MIN</span></div>
      <div><b id="c-s">0</b><span>SEG</span></div>
    </div>
  </section>

  <!-- CUÁNDO Y DÓNDE -->
  <section class="rv">
    <h2 class="sec-titulo">¿CUÁNDO Y DÓNDE?</h2>
    <div class="cards">
      <div class="card"><div class="ico">📅</div><div class="rot">FECHA</div><div class="val" id="i-fecha"></div><div class="sub" id="i-anio"></div></div>
      <div class="card"><div class="ico">🕗</div><div class="rot">HORA</div><div class="val" id="i-hora"></div><div class="sub">¡no llegues tarde!</div></div>
      <div class="card ancha"><div class="ico">📍</div><div class="rot">LUGAR</div><div class="val" id="i-lugar" style="text-transform:none"></div><div class="sub" id="i-ciudad"></div>
        <a class="btn" id="btn-mapa" target="_blank" rel="noopener">CÓMO LLEGAR</a></div>
    </div>
  </section>

  <!-- CONFIRMAR -->
  <section class="rv">
    <h2 class="sec-titulo">¿VAS A VENIR?</h2>
    <form class="form" id="form" autocomplete="off" novalidate>
      <div class="campo"><label class="l" for="f-nombre">NOMBRE Y APELLIDO</label><input type="text" id="f-nombre" maxlength="60"></div>
      <div class="error" id="f-error">Escribí tu nombre para confirmar 🙂</div>
      <div class="campo"><label class="l">¿VAS A PODER IR?</label>
        <div class="tog"><button type="button" class="on" id="b-si">¡SÍ, VOY!</button><button type="button" id="b-no">NO PUEDO</button></div></div>
      <div class="campo"><label class="l" for="f-msg">COMENTARIOS</label><textarea id="f-msg" maxlength="300" placeholder="Opcional"></textarea></div>
      <button class="btn" type="submit">CONFIRMAR POR WHATSAPP</button>
    </form>
  </section>

  <!-- CIERRE -->
  <section class="cierre rv">
    <p class="firma" id="firma"></p>
  </section>
</main>

<script>
/* ═════════════════ DATOS DE LA INVITACIÓN (lo único que hay que editar) ═════════════════ */
const CONFIG = {
  nombre:   'Lucio',                         // nombre del cumpleañero
  fecha:    '2026-12-12T21:00:00-03:00',     // AAAA-MM-DDTHH:MM:00-03:00  (hora de Argentina)
  lugar:    'Juan Prieto casa 13',
  ciudad:   'Córdoba',
  mapa:     'https://www.google.com/maps/place/Juan+Prieto+13,+X5000+C%C3%B3rdoba/@-31.4519977,-64.2165714,19z/data=!3m1!4b1!4m6!3m5!1s0x9432a248628db709:0x946b7ae3539c33a7!8m2!3d-31.4519988!4d-64.2159277!16s%2Fg%2F11w7r5bfbd?entry=ttu&g_ep=EgoyMDI2MTExOC4xIKXMDSoASAFQAw%3D%3D',
  whatsapp: '5493514087963'                // número que recibe las confirmaciones, con 549 y sin espacios
};
/* ═══════════════════════════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const fecha = new Date(CONFIG.fecha);
const tz = {timeZone:'America/Argentina/Cordoba'};

// textos
$('p-nombre').textContent = CONFIG.nombre.toUpperCase();
$('h-nombre').textContent = CONFIG.nombre.toUpperCase();
$('firma').textContent = 'TE ESPERO · ' + CONFIG.nombre.toUpperCase();
const fTxt = new Intl.DateTimeFormat('es-AR',{...tz,weekday:'long',day:'numeric',month:'long'}).format(fecha);
$('i-fecha').textContent = fTxt.charAt(0).toUpperCase() + fTxt.slice(1);
$('i-anio').textContent  = new Intl.DateTimeFormat('es-AR',{...tz,year:'numeric'}).format(fecha);
$('i-hora').textContent  = new Intl.DateTimeFormat('es-AR',{...tz,hour:'2-digit',minute:'2-digit',hour12:false}).format(fecha) + ' hs';
$('i-lugar').textContent = CONFIG.lugar;
$('i-ciudad').textContent = CONFIG.ciudad;
$('btn-mapa').href = CONFIG.mapa;
document.title = 'Cumpleaños de ' + CONFIG.nombre;

// cuenta regresiva
function tick(){
  let s = Math.max(0, Math.floor((fecha - Date.now())/1000));
  $('c-d').textContent = Math.floor(s/86400);
  $('c-h').textContent = String(Math.floor(s%86400/3600)).padStart(2,'0');
  $('c-m').textContent = String(Math.floor(s%3600/60)).padStart(2,'0');
  $('c-s').textContent = String(s%60).padStart(2,'0');
}
tick(); setInterval(tick,1000);

// abrir + música
const audio = $('audio'), btnM = $('musica');
function estado(){ btnM.textContent = audio.paused ? '🔇' : '🎵'; btnM.classList.toggle('suena',!audio.paused); }
$('btn-abrir').addEventListener('click',()=>{
  $('portada').classList.add('oculta');
  document.body.classList.remove('cerrada');
  document.body.classList.add('abierta');
  moverFondo();
  window.scrollTo(0,0);
  btnM.classList.add('ver');
  audio.volume = .8;
  audio.play().then(estado).catch(estado);
  observar();
});
btnM.addEventListener('click',()=>{ audio.paused ? audio.play() : audio.pause(); });
audio.addEventListener('play',estado); audio.addEventListener('pause',estado);

// el fondo completo recorre la imagen entera de arriba hacia abajo mientras se hace scroll
const fondo = $('fondo'), RATIO = 2300/580;
function moverFondo(){
  const w = fondo.clientWidth, vh = window.innerHeight, imgH = Math.max(w*RATIO, vh);
  const max = document.documentElement.scrollHeight - vh;
  const p = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  fondo.style.backgroundSize = 'auto ' + imgH + 'px';
  fondo.style.backgroundPosition = 'center ' + (-p * (imgH - vh)) + 'px';
}
window.addEventListener('scroll',()=>requestAnimationFrame(moverFondo),{passive:true});
window.addEventListener('resize',moverFondo);

// aparición al hacer scroll
function observar(){
  const els = document.querySelectorAll('.rv');
  if(!('IntersectionObserver' in window)){ els.forEach(e=>e.classList.add('vis')); return; }
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('vis'); io.unobserve(e.target);} }),{threshold:.12});
  els.forEach(e=>io.observe(e));
}

// confirmación por WhatsApp
let va = true;
$('b-si').onclick = ()=>{ va=true;  $('b-si').classList.add('on'); $('b-no').classList.remove('on'); };
$('b-no').onclick = ()=>{ va=false; $('b-no').classList.add('on'); $('b-si').classList.remove('on'); };
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const n = $('f-nombre').value.trim();
  $('f-error').style.display = n ? 'none' : 'block';
  if(!n){ $('f-nombre').focus(); return; }
  const m = $('f-msg').value.trim();
  const txt = 'Hola! Soy ' + n + '. ' + (va ? '¡Voy al cumple de ' + CONFIG.nombre + '! 🎉' : 'Lamentablemente no puedo ir al cumple de ' + CONFIG.nombre + '.') + (m ? '\nComentario: ' + m : '');
  window.location.href = 'https://api.whatsapp.com/send?phone=' + CONFIG.whatsapp + '&text=' + encodeURIComponent(txt);
});
</script>
</body>
</html>
